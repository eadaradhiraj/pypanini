name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: lint gate (strict files 100% clean)
        run: python -m unittest tests.test_lint -v
      - name: search + subanta + dhatu pilots (49-test gate)
        run: >
          python -m unittest
          tests.test_search
          tests.test_search_complete
          tests.test_subanta
          tests.test_subanta_full
          tests.test_krdanta_subanta
          tests.test_dhatu
